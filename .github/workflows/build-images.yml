name: Build System Images

on:
  push:
    branches:
      - main
      - ci
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional Rugix release version override."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release metadata
        id: metadata
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.release_version }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_VERSION_INPUT}" ]; then
              VERSION="${RELEASE_VERSION_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME}"
          else
              TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
              GIT_COMMIT=$(git rev-parse --short HEAD)
              VERSION="build-${TIMESTAMP}-${GIT_COMMIT}"
          fi

          if [[ ! "${VERSION}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "[ERROR] release version may only contain letters, numbers, dots, underscores, and hyphens"
              exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "[INFO] VERSION=${VERSION}"

  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: nexigon-os-efi-amd64
            runner: ubuntu-latest
          - system: nexigon-os-efi-arm64
            runner: ubuntu-24.04-arm
          - system: nexigon-os-rpi5
            runner: ubuntu-24.04-arm
          - system: nexigon-os-rpi4
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image and update bundle
        working-directory: debian
        env:
          SYSTEM: ${{ matrix.system }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          echo "[INFO] building image and update bundle for '${SYSTEM}' (version: ${VERSION})"
          ./run-bakery bake bundle "${SYSTEM}" \
              --release-version "${VERSION}" \
              --param-file params/staging.toml

          IMG_PATH="build/${SYSTEM}/system.img"
          if [ -e "${IMG_PATH}" ]; then
              echo "[INFO] compressing '${SYSTEM}' image"
              xz -T0 -f "${IMG_PATH}"
          else
              echo "[ERROR] expected image not found at '${IMG_PATH}'"
              exit 1
          fi

          sudo chown -R "$(id -u):$(id -g)" build

      - name: Collect artifacts
        working-directory: debian
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          mkdir -p "../dist/${SYSTEM}"

          collect_artifact() {
              src="$1"
              dest="$2"

              if [ -e "${src}" ]; then
                  ln "${src}" "${dest}" 2>/dev/null || cp "${src}" "${dest}"
              fi
          }

          collect_artifact "build/${SYSTEM}/system.img.xz" "../dist/${SYSTEM}/${SYSTEM}.img.xz"
          collect_artifact "build/${SYSTEM}/system.rugixb" "../dist/${SYSTEM}/${SYSTEM}.rugixb"
          collect_artifact "build/${SYSTEM}/system.rugixb-hash" "../dist/${SYSTEM}/${SYSTEM}.rugixb-hash"

          if [ -e "build/${SYSTEM}/sbom.cdx.json" ]; then
              collect_artifact "build/${SYSTEM}/sbom.cdx.json" "../dist/${SYSTEM}/${SYSTEM}.cdx.json"
          fi
          if [ -e "build/${SYSTEM}/sbom.spdx.json" ]; then
              collect_artifact "build/${SYSTEM}/sbom.spdx.json" "../dist/${SYSTEM}/${SYSTEM}.spdx.json"
          fi
          if [ -e "build/${SYSTEM}/system-build-info.json" ]; then
              collect_artifact "build/${SYSTEM}/system-build-info.json" "../dist/${SYSTEM}/${SYSTEM}.build-info.json"
          fi

          required_suffixes=(
              img.xz
              rugixb
              rugixb-hash
              spdx.json
              cdx.json
              build-info.json
          )
          for suffix in "${required_suffixes[@]}"; do
              if [ ! -f "../dist/${SYSTEM}/${SYSTEM}.${suffix}" ]; then
                  echo "[ERROR] required '${SYSTEM}.${suffix}' artifact is missing"
                  exit 1
              fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.system }}
          path: dist/${{ matrix.system }}/
          if-no-files-found: error
          compression-level: 0

  test-staging-vm:
    name: Test Staging VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run VM smoke test
        working-directory: debian
        run: ./scripts/test-staging-vm.sh

  publish-staging:
    name: Publish to Nexigon Staging
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
      - test-staging-vm
    if: github.event_name != 'pull_request' && vars.NEXIGON_STAGING_REPOSITORY != ''
    concurrency:
      group: nexigon-os-staging-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Install Nexigon CLI
        run: curl -fsSL https://install.nexigon.dev/download-cli.sh | sh

      - name: Validate staging publisher
        working-directory: debian
        run: ./scripts/test-publish-staging-release.sh

      - name: Publish staging assets and tags
        working-directory: debian
        env:
          ARTIFACT_DIR: ../dist
          BUILD_TAG: ${{ needs.prepare-release.outputs.version }}
          NEXIGON_CLI: ../nexigon-cli
          NEXIGON_PACKAGE: ${{ vars.NEXIGON_STAGING_PACKAGE }}
          NEXIGON_REPOSITORY: ${{ vars.NEXIGON_STAGING_REPOSITORY }}
          NEXIGON_STAGING_TOKEN: ${{ secrets.NEXIGON_STAGING_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NEXIGON_STAGING_TOKEN}" ]; then
              echo "[ERROR] NEXIGON_STAGING_TOKEN is not configured"
              exit 1
          fi

          floating_tag=""
          publish_staging="false"
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              remote_ref="refs/remotes/origin/${GITHUB_REF_NAME}"
              if ! remote_commit=$(git rev-parse --verify "${remote_ref}" 2>/dev/null) \
                  || [ "${remote_commit}" != "${GITHUB_SHA}" ]; then
                  echo "[INFO] a newer '${GITHUB_REF_NAME}' build exists; not moving channel tags"
              else
                  safe_branch=$(printf '%s' "${GITHUB_REF_NAME}" \
                      | sed 's/[^A-Za-z0-9._-]/-/g')
                  floating_tag="latest-build-${safe_branch}"
                  if [ "${GITHUB_REF_NAME}" = "main" ]; then
                      publish_staging="true"
                  fi
              fi
          fi

          config="${RUNNER_TEMP}/nexigon-cli.toml"
          cleanup() {
              if [ -f "${config}" ]; then
                  unlink "${config}"
              fi
          }
          trap cleanup EXIT

          umask 077
          printf 'hub-url = "https://staging.nexigon.dev"\ntoken = "%s"\n' \
              "${NEXIGON_STAGING_TOKEN}" >"${config}"

          export NEXIGON_CLI_CONFIG="${config}"
          export FLOATING_TAG="${floating_tag}"
          export PUBLISH_STAGING="${publish_staging}"
          export SOURCE_COMMIT="${GITHUB_SHA}"

          ./scripts/publish-staging-release.sh

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
      - test-staging-vm
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
              echo "[ERROR] no release assets found"
              exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --clobber
          else
              gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --title "${GITHUB_REF_NAME}" \
                  --notes "Nexigon OS image build for ${GITHUB_SHA}."
          fi
